[build-system]
requires=["setuptools>=61"]
build-backend="setuptools.build_meta"
[project]
name="credallab-finite"
version="0.2.0"
description="Exact finite probability constraints and primal-dual witnesses"
requires-python=">=3.10"
license={text="MIT"}
[project.scripts]
credallab="credallab.__main__:main"
[tool.setuptools]
packages=["credallab"]
